# ==============================================================================
# Nginx Configuration • financiesuaobra.com.br
# Arquitetura de Silos, Anti-Cache Estrito para Mobile e Reverse Proxy API
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html codigo.html;
    charset utf-8;

    # Gzip Compression for High Performance & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # 1. API REVERSE PROXY (Sincronização em Tempo Real Desktop <-> Mobile)
    # ==========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Anti-Cache Estrito Obrigatório na API
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ==========================================================================
    # 2. ARQUIVO DE DADOS ESTÁTICO DE FALLBACK (Anti-Cache)
    # ==========================================================================
    location = /content-data.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    # ==========================================================================
    # 3. DOCUMENTOS HTML (Prevenção Definitiva de Cache Agressivo no Mobile/WebKit)
    # ==========================================================================
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    # ==========================================================================
    # 4. ROTEAMENTO PRINCIPAL (Silos, Pretty URLs & Fallback)
    # ==========================================================================
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    # ==========================================================================
    # 5. ATIVOS ESTÁTICOS IMUTÁVEIS (Imagens e Fontes com Cache Longo)
    # ==========================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ==========================================================================
    # 6. DIRETIVAS DE MOTORES DE BUSCA
    # ==========================================================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Fallback 404
    error_page 404 /index.html;
}
