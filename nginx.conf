server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html codigo.html;
    charset utf-8;

    # Gzip Compression for High Performance & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main application routing (Silos, Pretty URLs & Static HTML Fallback)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Media and image caching (Retina photos, logos, favicons, vector SVGs)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Font Caching
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SEO directives caching
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Custom 404 handler fallback
    error_page 404 /index.html;
}
